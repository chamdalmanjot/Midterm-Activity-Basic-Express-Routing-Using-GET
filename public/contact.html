<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Latte Lounge</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="/">Latte <span>Lounge</span></a>
    <nav>
      <ul>
        <li><a class="link" href="/">Home</a></li>
        <li><a class="link" href="/menu">Menu</a></li>
        <li><a class="link" href="/about">About</a></li>
        <li><a class="link active" href="/contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="page">
    <div class="split">
      <img src="/images/contact.jpg" alt="Enjoying coffee at Latte Lounge">
      <section class="panel">
        <h1>Contact Us</h1>
        <form id="contact-form">
          <label for="name">Name</label>
          <input id="name" name="name" required>

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>

          <button class="btn" type="submit">Send message</button>
        </form>
        <p id="thanks" role="status"></p>
      </section>
    </div>
  </main>

  <footer>&copy; 2026 Latte Lounge. Steaming up some good vibes at the cafe.</footer>
  <script src="/js/contact.js"></script>
</body>
</html>
